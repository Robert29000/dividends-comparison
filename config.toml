[run]
symbols = ["GOOGL", "NVDA", "AAPL", "MSFT", "WDC"]
providers = ["reality", "xstocks", "robinhood"]
from_date = "2026-07-01"
to_date = "2026-09-30"

[paths]
data = "data"
output = "output"

[services]
alpha_vantage_url = "https://www.alphavantage.co/query"
blockscout_url = "https://api.blockscout.com/v2/api"

[providers.reality]
chain_id = 42161
network = "ARB"
rpc_url_env = "ARBITRUM_RPC_URL"
asset_url = "https://api.realityfinance.xyz/api/v1/rwa/assets/tickers"
log_address = "0xd01f8aa971a3f4d13d52299bdd30225b1d7f40f1"

[providers.xstocks]
chain_id = 1
network = "Ethereum"
rpc_url_env = "ETHEREUM_RPC_URL"
asset_url = "https://api.xstocks.fi/api/v2/public/assets/{symbol}x"

[providers.robinhood]
chain_id = 4663
network = "Robinhood Chain"
rpc_url_env = "ROBINHOOD_RPC_URL"
asset_url = "https://api.robinhood.com/rhj/assets"
